name: Validate Mystery Protocol Map
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          inline = [s for s in scripts if s.strip()]
          assert inline, "No inline JavaScript found"
          Path("/tmp/map-inline.js").write_text(chr(10).join(inline), encoding="utf-8")
          assert 'maplibre-gl' in html and 'view3d?65:0' in html, "Expected game map/3D controls are missing"
          assert "enterExpedition" in html and "geolocation" in html and "loadBuildings" in html, "Expected expedition features are missing"
          print("HTML structure check passed; extracted", len(inline), "inline script(s)")
          PY
          node --check /tmp/map-inline.js
      - name: Confirm no guessed checkpoints preloaded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert "const PRESETS" in html
          assert "DEFAULT_CHECKPOINTS" in html and "IS & CS Block" in html and "College Canteen" in html
          assert "new THREE.ExtrudeGeometry" in html and "MapServer/tile/" in html
          assert "function setView3D(on)" in html and "mp3d-focus" in html
          print("Verified real mapped landmarks, 3D building geometry, and selectable 2D/3D views.")
          PY
